[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Edge function netlify/edge-functions/prerender.ts serves crawlable HTML
# (own <title>, description, canonical, OG/Twitter tags and main content) for
# /, /for-teams, /app, /app-insights, /shared-app-report/*,
# /shared-competitor-report/* and the legacy /share/*. Its paths and
# `cache: "manual"` are declared in the function's own `config` export.

[[redirects]]
  from = "/sitemap.xml"
  to = "https://insightly-5iyw.onrender.com/sitemap.xml"
  status = 200
  force = true

# Auth & API proxy: route these through insightly.top so the whole Google
# OAuth flow (login -> Google -> callback) stays on the custom domain.
# Google's login page then shows insightly.top instead of onrender.com.
# Backend requirement: API_BASE_URL=https://insightly.top on Render, and
# https://insightly.top/auth/google/callback added as an authorized
# redirect URI in the Google Cloud Console OAuth client.
[[redirects]]
  from = "/auth/*"
  to = "https://insightly-5iyw.onrender.com/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://insightly-5iyw.onrender.com/api/:splat"
  status = 200
  force = true

# Other backend endpoints the frontend calls (NOT under /api/* or /auth/*).
# Found by auditing every `${SERVER_URL}...` usage in src/: the Stripe
# checkout/portal/subscription endpoints and the app-store scrapers.
# Without these, switching VITE_SERVER_URL to insightly.top would 404
# payments and "process app URL".
[[redirects]]
  from = "/app-store/*"
  to = "https://insightly-5iyw.onrender.com/app-store/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/google-play/*"
  to = "https://insightly-5iyw.onrender.com/google-play/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/create-checkout-session"
  to = "https://insightly-5iyw.onrender.com/create-checkout-session"
  status = 200
  force = true

[[redirects]]
  from = "/create-portal-session"
  to = "https://insightly-5iyw.onrender.com/create-portal-session"
  status = 200
  force = true

[[redirects]]
  from = "/create-subscription-session"
  to = "https://insightly-5iyw.onrender.com/create-subscription-session"
  status = 200
  force = true

# Known SPA routes: serve the app shell with HTTP 200.
# (Frontend requirement: VITE_SERVER_URL=https://insightly.top so the
# browser never leaves the custom domain for API calls.)
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/for-teams"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/app-insights"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/competitor-insights"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/chat"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/payment-success"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/payment-cancel"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/account"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/shared-app-report/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/shared-competitor-report/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/refund"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/extension"
  to = "/index.html"
  status = 200

# Unknown URLs: still serve the app shell (so the client-side 404 page
# renders) but return HTTP 404, so search engines stop treating bogus
# URLs as real pages.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Vite content-hashes everything under /assets, so it's safe to cache
# forever -- a new deploy always ships new filenames.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images in /public keep their filename across deploys, so use a
# shorter cache than the hashed assets above -- if one of these is ever
# replaced in place, visitors should still pick up the change within a week.
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/blogs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"