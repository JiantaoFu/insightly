[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/sitemap.xml"
  to = "https://insightly-5iyw.onrender.com/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite content-hashes everything under /assets, so it's safe to cache
# forever -- a new deploy always ships new filenames.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images in /public keep their filename across deploys, so use a
# shorter cache than the hashed assets above -- if one of these is ever
# replaced in place, visitors should still pick up the change within a week.
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/blogs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"